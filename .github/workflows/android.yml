name: Android APK

# Every push builds and tests the APK (downloadable as a workflow artifact).
# Pushes to main also publish it as a GitHub Release tagged build-<run number>,
# which the app checks to offer updates.
on:
  push:
    paths: ['app/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test
      - run: npx expo lint

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # With the four ANDROID_* secrets set, release builds use your own key.
      # Without them they keep the Expo template's debug key, which is what the
      # APKs installed so far are signed with, so updates install over them.
      - name: Choose signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "221e0a3106aa4c3ccc154e0a418b55020b3f9ea6e84f92e8749cd9e2f39f5e58  android/app/debug.keystore" | sha256sum -c - \
              || { echo "::error::Template debug keystore changed; this APK would not install over existing ones."; exit 1; }
            echo "::notice::No release keystore secrets; signing with the template debug key."
          fi

      - name: Build APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="threads-downloader-$VERSION-$BUILD_NUMBER.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: app/${{ steps.apk.outputs.name }}

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > "$RUNNER_TEMP/notes.md"
          gh release create "build-$BUILD_NUMBER" "${{ steps.apk.outputs.name }}" \
            --target "$GITHUB_SHA" \
            --title "Threads 下載 ${{ steps.apk.outputs.version }} (build $BUILD_NUMBER)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
